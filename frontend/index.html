<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Витрати</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.4; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-bottom: 1rem; }
    form input { padding: .5rem; font: inherit; min-width: 0; }
    form button { grid-column: 1 / -1; padding: .6rem; font: inherit; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; gap: 1rem; padding: .4rem 0; border-bottom: 1px solid #ddd; }
    .meta { color: #666; font-size: .9rem; }
    #status { min-height: 1.4em; }
  </style>
</head>
<body>
  <h1>Витрати</h1>

  <form id="form">
    <input id="date" type="date" required>
    <input id="category" placeholder="категорія" required>
    <input id="title" placeholder="назва" required>
    <input id="amount" type="number" step="0.01" placeholder="сума" required>
    <button>Додати</button>
  </form>

  <p id="status"></p>
  <ul id="list"></ul>

  <script>
    const API = "https://api.liznichenko.pp.ua";
    const status = document.getElementById("status");

    async function load() {
      try {
        const response = await fetch(API + "/items");
        const items = await response.json();
        const list = document.getElementById("list");
        list.innerHTML = "";
        for (const item of items) {
          const li = document.createElement("li");

          const left = document.createElement("span");
          left.textContent = item.title;

          const right = document.createElement("span");
          right.className = "meta";
          right.textContent = `${item.date}  ${item.category}  ${item.amount}`;

          li.appendChild(left);
          li.appendChild(right);
          list.appendChild(li);
        }
      } catch (error) {
        status.textContent = "не вдалося завантажити список";
      }
    }

    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const body = {
        date: document.getElementById("date").value,
        category: document.getElementById("category").value,
        title: document.getElementById("title").value,
        amount: document.getElementById("amount").value,
      };
      try {
        const response = await fetch(API + "/items", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const result = await response.json();
        status.textContent = response.ok ? "додано" : "помилка: " + result.error;
        if (response.ok) event.target.reset();
      } catch (error) {
        status.textContent = "помилка: немає зв’язку з сервером";
      }
      load();
    });

    load();
  </script>
</body>
</html>
