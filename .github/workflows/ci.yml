name: ci
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v

  deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Update the service
        working-directory: C:/Users/Lenovo/expense-tracker-server
        run: |
          git pull
          docker compose up -d --build
